apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-network-policy
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow health checks — no other service calls this directly
    - ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow outbound to Kafka
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow outbound to SMTP (Mailtrap or any external SMTP)
    - ports:
        - protocol: TCP
          port: 2525
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
